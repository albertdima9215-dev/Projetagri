<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne - AgriConnect Faso</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f7f4;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      padding:20px;
    }

    .card{
      background:white;
      padding:30px 24px;
      border-radius:20px;
      box-shadow:0 6px 20px rgba(0,0,0,.08);
      max-width:320px;
      width:100%;
    }

    h1{
      color:#2e7d32;
      margin-bottom:12px;
    }

    p{
      color:#555;
      line-height:1.5;
    }

    button{
      margin-top:20px;
      background:#2e7d32;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:12px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>📶 Hors ligne</h1>

    <p>
      Vous n'avez pas de connexion Internet.
      Certaines données déjà consultées restent disponibles.
    </p>

    <button onclick="location.reload()">
      Réessayer
    </button>
  </div>
</body>
</html>
